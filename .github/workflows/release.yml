name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, test and pack, but do not push to NuGet or create a release"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # required for Trusted Publishing: enables GitHub OIDC token issuance
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Read version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read <Version> from Directory.Build.props"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Verify release branch
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must run from main. Current ref is $GITHUB_REF."
            exit 1
          fi

      - name: Verify release tag
        if: ${{ !inputs.dry_run }}
        run: |
          git fetch --tags --quiet
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG points to $TAG_COMMIT, not the release commit $GITHUB_SHA."
              exit 1
            fi
            echo "Tag $TAG already points to this release commit; the GitHub release will reuse it."
          fi

      - name: Restore
        run: |
          dotnet restore PeerSharp.slnx
          dotnet tool restore

      - name: Verify formatting
        run: dotnet format PeerSharp.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build PeerSharp.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        # The repository uses Microsoft.Testing.Platform. Its .NET 10 CLI requires an explicit
        # solution option and does not support VSTest's --logger argument.
        run: dotnet test --solution PeerSharp.slnx --no-build --configuration Release --no-ansi --output Normal

      - name: Pack
        run: |
          dotnet pack src/PeerSharp/PeerSharp.csproj --no-build --configuration Release --output packages
          dotnet pack src/PeerSharp.WebTorrent/PeerSharp.WebTorrent.csproj --no-build --configuration Release --output packages
          ls -l packages

      - name: Generate and validate release SBOMs
        shell: pwsh
        run: ./tools/generate-release-sboms.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PeerSharp-${{ steps.version.outputs.version }}-release
          path: packages/*
          if-no-files-found: error

      - name: Attest release provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            packages/*.nupkg
            packages/*.snupkg
            packages/*.spdx.json

      - name: Attest PeerSharp SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            packages/PeerSharp.${{ steps.version.outputs.version }}.nupkg
            packages/PeerSharp.${{ steps.version.outputs.version }}.snupkg
          sbom-path: packages/PeerSharp.${{ steps.version.outputs.version }}.spdx.json

      - name: Attest PeerSharp.WebTorrent SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            packages/PeerSharp.WebTorrent.${{ steps.version.outputs.version }}.nupkg
            packages/PeerSharp.WebTorrent.${{ steps.version.outputs.version }}.snupkg
          sbom-path: packages/PeerSharp.WebTorrent.${{ steps.version.outputs.version }}.spdx.json

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived (1h) NuGet API
      # key. No stored secrets; nuget.org validates this workflow against the trusted
      # publishing policy configured for the account. Runs right before the push because
      # the temporary key expires.
      - name: NuGet login (OIDC -> temp API key)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ligenq # nuget.org profile name (not email)

      # The glob matches .nupkg only, but `dotnet nuget push` also uploads the matching .snupkg
      # when one sits beside it - that is the default, and --no-symbols is what opts out. Do not
      # add a separate *.snupkg push: it would be rejected as a duplicate.
      - name: Push to NuGet
        if: ${{ !inputs.dry_run }}
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create git tag and GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          packages/*.nupkg
          packages/*.snupkg
          packages/*.spdx.json
          --title "v${{ steps.version.outputs.version }}"
          --generate-notes
          --target "${{ github.sha }}"
