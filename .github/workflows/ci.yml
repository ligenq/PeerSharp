name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  core-tests:
    name: Core ${{ matrix.lane }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lane: fast
            filter: --filter-not-namespace PeerSharp.Tests.Integration --filter-not-namespace PeerSharp.Tests.Integration.Synthetic --filter-not-namespace PeerSharp.Tests.Concurrency --filter-not-namespace PeerSharp.Tests.Robustness --filter-not-namespace PeerSharp.Tests.Interop
          - os: windows-latest
            lane: fast
            filter: --filter-not-namespace PeerSharp.Tests.Integration --filter-not-namespace PeerSharp.Tests.Integration.Synthetic --filter-not-namespace PeerSharp.Tests.Concurrency --filter-not-namespace PeerSharp.Tests.Robustness --filter-not-namespace PeerSharp.Tests.Interop
          - os: ubuntu-latest
            lane: integration
            filter: --filter-namespace PeerSharp.Tests.Integration --filter-namespace PeerSharp.Tests.Integration.Synthetic
          - os: windows-latest
            lane: integration
            filter: --filter-namespace PeerSharp.Tests.Integration --filter-namespace PeerSharp.Tests.Integration.Synthetic
          - os: ubuntu-latest
            lane: concurrency-robustness
            filter: --filter-namespace PeerSharp.Tests.Concurrency --filter-namespace PeerSharp.Tests.Robustness
          - os: windows-latest
            lane: concurrency-robustness
            filter: --filter-namespace PeerSharp.Tests.Concurrency --filter-namespace PeerSharp.Tests.Robustness
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/PeerSharp.Tests/PeerSharp.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build tests/PeerSharp.Tests/PeerSharp.Tests.csproj --no-restore --configuration Release -warnaserror

      - name: Test ${{ matrix.lane }}
        run: >
          dotnet test --project tests/PeerSharp.Tests/PeerSharp.Tests.csproj
          --no-build
          --configuration Release
          --
          ${{ matrix.filter }}
          --report-trx
          --report-trx-filename core-${{ matrix.lane }}-${{ matrix.os }}.trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.lane }}-${{ matrix.os }}-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  trim-smoke:
    # PeerSharp declares IsTrimmable. This is what stops that from being an unchecked claim:
    # PublishTrimmed runs ILLink over the library and TreatWarningsAsErrors turns any IL2xxx
    # diagnostic into a failure. Running the result afterwards catches the case where trimming
    # succeeds but removes something the engine needs at startup.
    name: Trim analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish trimmed (trim warnings are errors)
        run: dotnet publish tests/PeerSharp.TrimSmoke/PeerSharp.TrimSmoke.csproj --configuration Release --output trimout

      - name: Run trimmed binary
        run: ./trimout/PeerSharp.TrimSmoke

  benchmarks-smoke:
    # Deliberately not a measurement job: shared CI runners are far too noisy for numbers worth
    # acting on. This only proves the suites still compile and their fixtures still set up, so
    # benchmarks cannot silently rot between the runs a human actually reads.
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore benchmarks/PeerSharp.Benchmarks/PeerSharp.Benchmarks.csproj

      - name: Build (warnings as errors)
        run: dotnet build benchmarks/PeerSharp.Benchmarks/PeerSharp.Benchmarks.csproj --no-restore --configuration Release -warnaserror

      - name: Dry-run all suites
        run: >
          dotnet run --project benchmarks/PeerSharp.Benchmarks --configuration Release --no-build
          -- --filter "*" --job Dry

  fuzz-harness-smoke:
    # PRs do not run a fuzzer indefinitely. They do prove both entry points compile and replay the
    # committed corpus so harnesses and seeds cannot silently rot between scheduled fuzzing runs.
    name: Fuzz harnesses (seed replay)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/PeerSharp.Fuzz/PeerSharp.Fuzz.csproj

      - name: Build (warnings as errors)
        run: dotnet build tests/PeerSharp.Fuzz/PeerSharp.Fuzz.csproj --no-restore --configuration Release -warnaserror

      - name: Replay seed corpus
        run: dotnet run --project tests/PeerSharp.Fuzz --configuration Release --no-build -- --self-test

  webtorrent-tests:
    name: WebTorrent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/PeerSharp.WebTorrent.Tests/PeerSharp.WebTorrent.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build tests/PeerSharp.WebTorrent.Tests/PeerSharp.WebTorrent.Tests.csproj --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test --project tests/PeerSharp.WebTorrent.Tests/PeerSharp.WebTorrent.Tests.csproj
          --no-build
          --configuration Release
          --
          --report-trx
          --report-trx-filename webtorrent-${{ matrix.os }}.trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webtorrent-${{ matrix.os }}-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
