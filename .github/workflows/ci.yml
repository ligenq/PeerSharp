name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Restore and audit dependencies
        run: dotnet restore PeerSharp.slnx

      - name: Verify formatting
        run: dotnet format PeerSharp.slnx --verify-no-changes --no-restore

      - name: Strict Debug build
        run: dotnet build PeerSharp.slnx --no-restore --configuration Debug --warnaserror

  core-tests:
    name: Core ${{ matrix.lane }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lane: fast
            filter: --filter-not-namespace PeerSharp.Tests.Integration --filter-not-namespace PeerSharp.Tests.Integration.Synthetic --filter-not-namespace PeerSharp.Tests.Concurrency --filter-not-namespace PeerSharp.Tests.Robustness --filter-not-namespace PeerSharp.Tests.Interop
          - os: windows-latest
            lane: fast
            filter: --filter-not-namespace PeerSharp.Tests.Integration --filter-not-namespace PeerSharp.Tests.Integration.Synthetic --filter-not-namespace PeerSharp.Tests.Concurrency --filter-not-namespace PeerSharp.Tests.Robustness --filter-not-namespace PeerSharp.Tests.Interop
          - os: ubuntu-latest
            lane: integration
            filter: --filter-namespace PeerSharp.Tests.Integration --filter-namespace PeerSharp.Tests.Integration.Synthetic
          - os: windows-latest
            lane: integration
            filter: --filter-namespace PeerSharp.Tests.Integration --filter-namespace PeerSharp.Tests.Integration.Synthetic
          - os: ubuntu-latest
            lane: concurrency-robustness
            filter: --filter-namespace PeerSharp.Tests.Concurrency --filter-namespace PeerSharp.Tests.Robustness
          - os: windows-latest
            lane: concurrency-robustness
            filter: --filter-namespace PeerSharp.Tests.Concurrency --filter-namespace PeerSharp.Tests.Robustness
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore tests/PeerSharp.Tests/PeerSharp.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build tests/PeerSharp.Tests/PeerSharp.Tests.csproj --no-restore --configuration Release -warnaserror

      - name: Test ${{ matrix.lane }}
        run: >
          dotnet test --project tests/PeerSharp.Tests/PeerSharp.Tests.csproj
          --no-build
          --configuration Release
          --results-directory TestResults
          --
          ${{ matrix.filter }}
          --report-trx
          --report-trx-filename core-${{ matrix.lane }}-${{ matrix.os }}.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-${{ matrix.lane }}-${{ matrix.os }}-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  trim-smoke:
    # PeerSharp declares IsTrimmable. This is what stops that from being an unchecked claim:
    # PublishTrimmed runs ILLink over the library and TreatWarningsAsErrors turns any IL2xxx
    # diagnostic into a failure. Running the result afterwards catches the case where trimming
    # succeeds but removes something the engine needs at startup.
    name: Trim analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Publish trimmed (trim warnings are errors)
        run: dotnet publish tests/PeerSharp.TrimSmoke/PeerSharp.TrimSmoke.csproj --configuration Release --output trimout

      - name: Run trimmed binary
        run: ./trimout/PeerSharp.TrimSmoke

  benchmarks-smoke:
    # Deliberately not a measurement job: shared CI runners are far too noisy for numbers worth
    # acting on. This only proves the suites still compile and their fixtures still set up, so
    # benchmarks cannot silently rot between the runs a human actually reads.
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore benchmarks/PeerSharp.Benchmarks/PeerSharp.Benchmarks.csproj

      - name: Build (warnings as errors)
        run: dotnet build benchmarks/PeerSharp.Benchmarks/PeerSharp.Benchmarks.csproj --no-restore --configuration Release -warnaserror

      - name: Dry-run all suites
        run: >
          dotnet run --project benchmarks/PeerSharp.Benchmarks --configuration Release --no-build
          -- --filter "*" --job Dry

  fuzz-harness-smoke:
    # PRs do not run a fuzzer indefinitely. They do prove both entry points compile and replay the
    # committed corpus so harnesses and seeds cannot silently rot between scheduled fuzzing runs.
    name: Fuzz harnesses (seed replay)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore tests/PeerSharp.Fuzz/PeerSharp.Fuzz.csproj

      - name: Build (warnings as errors)
        run: dotnet build tests/PeerSharp.Fuzz/PeerSharp.Fuzz.csproj --no-restore --configuration Release -warnaserror

      - name: Replay seed corpus
        run: dotnet run --project tests/PeerSharp.Fuzz --configuration Release --no-build -- --self-test

  webtorrent-tests:
    name: WebTorrent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore tests/PeerSharp.WebTorrent.Tests/PeerSharp.WebTorrent.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build tests/PeerSharp.WebTorrent.Tests/PeerSharp.WebTorrent.Tests.csproj --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test --project tests/PeerSharp.WebTorrent.Tests/PeerSharp.WebTorrent.Tests.csproj
          --no-build
          --configuration Release
          --results-directory TestResults
          --
          --report-trx
          --report-trx-filename webtorrent-${{ matrix.os }}.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webtorrent-${{ matrix.os }}-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore PeerSharp.slnx

      - name: Build
        run: dotnet build PeerSharp.slnx --no-restore --configuration Release --warnaserror

      - name: Core coverage
        run: >
          dotnet test --project tests/PeerSharp.Tests/PeerSharp.Tests.csproj
          --no-build --configuration Release --results-directory TestResults --
          --coverage --coverage-output-format cobertura
          --coverage-settings coverage.runsettings
          --coverage-output coverage/core.cobertura.xml

      - name: WebTorrent coverage
        run: >
          dotnet test --project tests/PeerSharp.WebTorrent.Tests/PeerSharp.WebTorrent.Tests.csproj
          --no-build --configuration Release --results-directory TestResults --
          --coverage --coverage-output-format cobertura
          --coverage-settings coverage.webtorrent.runsettings
          --coverage-output coverage/webtorrent.cobertura.xml

      - name: Enforce coverage floor
        shell: pwsh
        run: >
          ./tools/coverage-summary.ps1
          -Reports TestResults/coverage/core.cobertura.xml,TestResults/coverage/webtorrent.cobertura.xml
          -MinimumLinePercent 80
          -MinimumBranchPercent 80

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: TestResults/coverage/*.cobertura.xml
          if-no-files-found: error

  ci:
    # Branch protection requires one stable check name. Requiring every matrix expansion directly
    # makes the repository rule drift whenever a lane or operating system changes, while this gate
    # still fails unless every required job (and every member of each matrix) succeeded.
    name: CI
    if: ${{ always() }}
    needs:
      - quality
      - core-tests
      - trim-smoke
      - benchmarks-smoke
      - fuzz-harness-smoke
      - webtorrent-tests
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          CORE_TESTS: ${{ needs.core-tests.result }}
          TRIM_SMOKE: ${{ needs.trim-smoke.result }}
          BENCHMARKS_SMOKE: ${{ needs.benchmarks-smoke.result }}
          FUZZ_HARNESS_SMOKE: ${{ needs.fuzz-harness-smoke.result }}
          WEBTORRENT_TESTS: ${{ needs.webtorrent-tests.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          failed=0
          for result in \
            "quality=$QUALITY" \
            "core-tests=$CORE_TESTS" \
            "trim-smoke=$TRIM_SMOKE" \
            "benchmarks-smoke=$BENCHMARKS_SMOKE" \
            "fuzz-harness-smoke=$FUZZ_HARNESS_SMOKE" \
            "webtorrent-tests=$WEBTORRENT_TESTS" \
            "coverage=$COVERAGE"
          do
            echo "$result"
            if [ "${result#*=}" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
